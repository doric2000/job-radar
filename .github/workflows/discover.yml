name: discover

# Finds each company's job-board (Greenhouse / Lever / Ashby / Comeet / SmartRecruiters / ...) and validates it.
# Run it manually after editing companies.yaml; it also runs weekly to revalidate and keep the repo active.
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-resolve companies already marked ok"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Discover boards
        run: python -m radar.discover ${{ inputs.refresh && '--refresh' || '' }}

      - name: Healthcheck fetchers against the live services
        run: python -m radar.run --healthcheck || true

      - name: Commit results
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          git add data/resolved.json data/discovery_report.md
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -qm "discovery $(date -u +%F)"
            git push
          fi
